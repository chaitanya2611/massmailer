# Render Blueprint — deploy via the Render dashboard: New + -> Blueprint,
# point it at this repo, and Render will read this file automatically.
# See README.md "Deploying to Render" for the click-through steps and which
# env vars need to be filled in manually (marked `sync: false` below).

databases:
  - name: massmailer-db
    plan: free
    databaseName: massmailer
    user: massmailer

services:
  - type: web
    name: massmailer
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: DATABASE_URL
        fromDatabase:
          name: massmailer-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # From Google Cloud Console / Azure Portal — see sending/oauth.py for setup steps.
      # Leave blank to launch without live sending; connect accounts once these are set.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
