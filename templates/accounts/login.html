{% extends "base.html" %}
{% block title %}Log in — Massmailer{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <div class="card">
    <form method="post" class="stacked">
      {% csrf_token %}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="help-text" style="color:var(--danger)">{{ error }}</p>{% endfor %}
      {% endfor %}
      <p style="margin-top:20px"><button type="submit" class="btn">Log in</button></p>
    </form>
  </div>
  <p class="help-text">No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
{% endblock %}
